<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Tracker - Versi Akurat</title>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
    input, button { padding: 14px; margin: 10px 0; width: 100%; border-radius: 8px; font-size: 16px; }
    button { background: #27ae60; color: white; border: none; cursor: pointer; }
    button:hover { background: #219653; }
    #map { height: 450px; margin: 20px 0; border-radius: 10px; }
    .result { display: none; padding: 20px; background: #f8f9fa; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📍 Phone Location Tracker (Versi Akurat)</h1>
    <p>Masukkan nomor telepon Indonesia</p>
    
    <input type="tel" id="phone" placeholder="081234567890 atau +6281234567890" />
    <button onclick="trackLocation()">🔍 Lacak Sekarang</button>

    <div id="result" class="result">
      <h3>Hasil:</h3>
      <p><strong>Nomor:</strong> <span id="num"></span></p>
      <p><strong>Lokasi Registrasi:</strong> <span id="location"></span></p>
      <p><strong>Provider:</strong> <span id="carrier"></span></p>
      <p><strong>Status:</strong> <span id="status"></span></p>
      <div id="map"></div>
      
      <h4>Cara Dapat Lokasi Akurat (Real-time):</h4>
      <p>Kirim link ini ke target → mereka buka & izinkan lokasi.</p>
      <button onclick="generateShareLink()">📤 Buat Link Share Lokasi</button>
    </div>
  </div>

  <script>
    const API_KEY = "4781c41763b533a75e1edb8608d9db9d"; // dari numverify.com

    async function trackLocation() {
      const phone = document.getElementById('phone').value.trim();
      if (!phone) return alert("Masukkan nomor!");

      const result = document.getElementById('result');
      result.style.display = 'block';

      try {
        const res = await fetch(`https://apilayer.net/api/validate?access_key=${API_KEY}&number=${encodeURIComponent(phone)}&country_code=ID`);
        const data = await res.json();

        document.getElementById('num').textContent = data.international_format || phone;
        document.getElementById('location').textContent = data.location || "Tidak terdeteksi";
        document.getElementById('carrier').textContent = data.carrier || "-";
        document.getElementById('status').textContent = data.valid ? "Valid" : "Tidak Valid";

        showMap(data.location || "Jakarta");
      } catch (e) {
        alert("Gagal terhubung ke API. Cek API Key.");
      }
    }

    let map;
    function showMap(city) {
      const cityCoords = {
        "Jakarta": [-6.2088, 106.8456], "Surabaya": [-7.2575, 112.7521],
        "Bandung": [-6.9147, 107.6098], "Medan": [3.5952, 98.6722]
      };
      const coords = cityCoords[city] || [-6.2088, 106.8456];

      if (map) map.remove();
      map = L.map('map').setView(coords, 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      L.marker(coords).addTo(map).bindPopup(`📍 ${city}`).openPopup();
    }

    function generateShareLink() {
      const link = `https://www.google.com/maps?q=loc:${navigator.geolocation.getCurrentPosition ? 'minta_izin' : 'Lokasi_anda'}`;
      alert("Link share lokasi (contoh):\nhttps://maps.google.com/?q=lat,long\n\nKirim link ini ke orang yang mau dilacak, minta mereka buka & share lokasi.");
    }
  </script>
</body>
</html>
